version: '3.8'
services:
  web:
    image: minhtan3110/sportbooking:latest
    container_name: sportbooking_web
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Các biến môi trường khác sẽ được truyền vào từ máy chủ EC2 (qua file .env)
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:latest
    container_name: sportbooking_redis
    ports:
      - "6379:6379"
    restart: always
