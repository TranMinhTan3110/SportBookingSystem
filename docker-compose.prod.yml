version: '3.8'
services:
  web:
    image: minhtan3110/sportbooking:latest
    container_name: sportbooking_web
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RabbitMQ__HostName=rabbitmq
      - ConnectionStrings__Redis=redis:6379
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq
    restart: always

  redis:
    image: redis:latest
    container_name: sportbooking_redis
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sportbooking_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  worker:
    image: minhtan3110/sportbooking-worker:latest
    container_name: sportbooking_worker
    environment:
      - RabbitMQ__HostName=rabbitmq
    env_file:
      - .env
    depends_on:
      - rabbitmq
    restart: always
